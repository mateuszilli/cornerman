name: cornerman
description: Boxing round timer — gym-ready, cross-platform.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.3.2
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.10
  shared_preferences: ^2.3.3
  vibration: ^3.2.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/bell.wav
    - assets/sounds/clapper.wav
    - assets/sounds/beep.wav
    - assets/sounds/silence.wav
