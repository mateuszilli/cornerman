name: cornerman
description: Boxing round timer — gym-ready, cross-platform.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.10
  shared_preferences: ^2.3.3
  vibration: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/bell.mp3
    - assets/sounds/clapper.mp3
    - assets/sounds/beep.mp3
